[project]
name = "mcp-guardrail-gateway"
version = "0.1.0"
description = "Deterministic security middleware wrapping LLM agent tool calls (AI AppSec portfolio project)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyjwt>=2.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mcp>=2.3",
    "anyio>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
